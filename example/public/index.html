<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Errands</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #f4f5f7; color: #1b1e24; }
  nav { display: flex; gap: 20px; padding: 14px 32px; background: #1b1e24; }
  nav a { color: #cfd4dd; text-decoration: none; }
  nav a[aria-current] { color: #fff; font-weight: 600; }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  h1 { margin: 0 0 4px; font-size: 32px; }
  #count { color: #5d6370; margin: 0 0 20px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { flex: 1; padding: 10px 12px; font: inherit; border: 1px solid #c9cdd5; border-radius: 6px; }
  button { padding: 10px 16px; font: inherit; border: 0; border-radius: 6px; background: #2f5bd3; color: #fff; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  li { display: flex; gap: 10px; align-items: center; background: #fff; padding: 10px 12px; border-radius: 6px; border: 1px solid #e1e4ea; }
  li.done span { text-decoration: line-through; color: #8a909c; }
  .empty { color: #8a909c; }
</style>
</head>
<body>
<nav><a href="/" aria-current="page">Errands</a><a href="/about">About</a></nav>
<main>
  <h1>Errands</h1>
  <p id="count">0 items left</p>
  <form id="add">
    <label for="new" hidden>New errand</label>
    <input id="new" type="text" placeholder="What needs doing?" autocomplete="off">
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>
  <p class="empty" id="empty">Nothing yet. Add your first errand above.</p>
</main>
<script>
  window.PLANTED_BUG = false;
  const items = [];
  const list = document.getElementById('list');
  function render() {
    list.innerHTML = '';
    for (const [i, it] of items.entries()) {
      const li = document.createElement('li');
      if (it.done) li.className = 'done';
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = it.done;
      box.setAttribute('aria-label', 'Done: ' + it.text);
      box.addEventListener('change', () => { items[i].done = box.checked; render(); });
      const span = document.createElement('span');
      span.textContent = it.text;
      li.append(box, span);
      list.append(li);
    }
    const left = items.filter((it) => !it.done).length;
    const word = left === 1 && !window.PLANTED_BUG ? 'item' : 'items';
    document.getElementById('count').textContent = left + ' ' + word + ' left';
    document.getElementById('empty').hidden = items.length > 0;
  }
  document.getElementById('add').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('new');
    const text = input.value.trim();
    if (!text) return;
    items.push({ text, done: false });
    input.value = '';
    render();
  });
  render();
</script>
</body>
</html>
